<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #eef4f8;
    }
    .page { width: min(100%, 720px); }
    .card {
      padding: 32px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(15, 53, 87, 0.12);
    }
    h1 { margin: 0 0 8px; color: #123b5d; }
    .intro { margin: 0 0 24px; color: #52606d; }
    .field { margin-bottom: 18px; }
    label, legend { display: block; margin-bottom: 7px; font-weight: 700; }
    input, textarea, select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #a8b5bf;
      border-radius: 6px;
      font: inherit;
    }
    input:focus, textarea:focus, select:focus {
      outline: 3px solid rgba(20, 110, 160, 0.18);
      border-color: #146ea0;
    }
    textarea { min-height: 120px; resize: vertical; }
    fieldset { padding: 0; border: 0; }
    .radio-group { display: flex; flex-wrap: wrap; gap: 18px; }
    .radio-group label { display: flex; align-items: center; gap: 7px; font-weight: 400; }
    .radio-group input { width: auto; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    button {
      padding: 11px 20px;
      border: 0;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .preview-button { color: #123b5d; background: #dcebf4; }
    .submit-button { color: #ffffff; background: #146ea0; }
    button:hover { filter: brightness(0.94); }
    #preview {
      display: none;
      margin-top: 24px;
      padding: 22px;
      border-left: 5px solid #146ea0;
      border-radius: 6px;
      background: #f7fbfd;
    }
    #preview h2 { margin-top: 0; color: #123b5d; }
    #preview dt { margin-top: 10px; font-weight: 700; }
    #preview dd { margin: 3px 0 0; white-space: pre-wrap; }
    @media (max-width: 520px) {
      .card { padding: 22px; }
      .actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Contact Us</h1>
      <p class="intro">Complete the form below and we will respond using your preferred contact method.</p>

      <!-- The main form uses POST for final submission. The Preview button overrides
           the method with GET so the same page can read and display the values. -->
      <form action="https://httpbin.org/post" method="post">
        <div class="field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" required
                 autocomplete="name" placeholder="Enter your full name">
        </div>

        <div class="field">
          <label for="emailAddress">Email Address</label>
          <!-- type=email checks the email format in the user's browser. -->
          <input type="email" id="emailAddress" name="emailAddress" required
                 autocomplete="email" placeholder="name@example.com">
        </div>

        <div class="field">
          <label for="phoneNumber">Phone Number</label>
          <!-- The pattern requires exactly ten digits and its title explains the rule. -->
          <input type="tel" id="phoneNumber" name="phoneNumber" required
                 pattern="[0-9]{10}" maxlength="10" inputmode="numeric"
                 autocomplete="tel" placeholder="0712345678"
                 title="Please enter exactly 10 digits without spaces or symbols.">
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required
                    placeholder="Write your message here"></textarea>
        </div>

        <fieldset class="field">
          <legend>Preferred Contact Method</legend>
          <div class="radio-group">
            <label><input type="radio" name="contactMethod" value="Email" required> Email</label>
            <label><input type="radio" name="contactMethod" value="Phone"> Phone</label>
            <label><input type="radio" name="contactMethod" value="Both"> Both</label>
          </div>
        </fieldset>

        <div class="field">
          <label for="inquiryType">Inquiry Type</label>
          <select id="inquiryType" name="inquiryType" required>
            <option value="" selected disabled>Select an inquiry type</option>
            <option value="General Inquiry">General Inquiry</option>
            <option value="Support Request">Support Request</option>
            <option value="Feedback">Feedback</option>
          </select>
        </div>

        <div class="actions">
          <!-- formmethod=get and formaction="" reload this page with form values
               in the URL, allowing the preview script below to display them. -->
          <button class="preview-button" type="submit" formmethod="get" formaction="">Preview</button>
          <button class="submit-button" type="submit">Submit Form</button>
        </div>
      </form>

      <!-- This region is filled only after a valid GET preview request. -->
      <section id="preview" aria-live="polite">
        <h2>Form Preview</h2>
        <dl>
          <dt>Name</dt><dd id="previewName"></dd>
          <dt>Email</dt><dd id="previewEmail"></dd>
          <dt>Phone</dt><dd id="previewPhone"></dd>
          <dt>Message</dt><dd id="previewMessage"></dd>
          <dt>Preferred Contact Method</dt><dd id="previewContact"></dd>
          <dt>Inquiry Type</dt><dd id="previewInquiry"></dd>
        </dl>
      </section>
    </section>
  </main>

  <script>
    // URLSearchParams reads the values placed in the URL by the GET preview request.
    const queryData = new URLSearchParams(window.location.search);

    if (queryData.has("fullName")) {
      const fieldMap = {
        previewName: "fullName",
        previewEmail: "emailAddress",
        previewPhone: "phoneNumber",
        previewMessage: "message",
        previewContact: "contactMethod",
        previewInquiry: "inquiryType"
      };

      // textContent displays user input safely because it does not interpret HTML.
      Object.entries(fieldMap).forEach(([outputId, parameterName]) => {
        document.getElementById(outputId).textContent = queryData.get(parameterName) || "Not provided";
      });

      document.getElementById("preview").style.display = "block";
    }
  </script>
</body>
</html>
